[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neutralgrid"
version = "6.5.8"
description = "NEUTRAL Futures Grid Bot Validator for Binance USDT-M"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    # NOTE: pyarrow is a compiled dependency with platform-specific wheels.
    # CI/deployment environments MUST install from requirements.lock to ensure
    # a pinned, reproducible version.  The range specifier below is only a
    # minimum compatibility floor for local development.
    "pyarrow>=14.0.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.6.0,<1.10",
    "hmmlearn>=0.3.0",
    "joblib>=1.5.0",
    "openpyxl>=3.1.0",
    "PyYAML>=6.0.0",
    "aiosqlite>=0.21.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.11.0",
    "httpx>=0.28.0",
    "truststore>=0.10.4",
    "websockets>=16.0",
]

[project.scripts]
neutralgrid-retrain = "neutralgrid.cli.retrain:cli_main"
neutralgrid-replay = "neutralgrid.replay.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.4.2,<9.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["neutralgrid*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportReturnType = true
reportArgumentType = true
reportAttributeAccessIssue = true
reportOptionalMemberAccess = true
reportCallIssue = true
reportUndefinedVariable = true
reportMissingImports = true
reportMissingTypeStubs = false
